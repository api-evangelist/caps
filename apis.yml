name: CAPS
description: 'CAPS Inc. (CAPS株式会社) is a Tokyo-based Healthcare x IT company founded in December
  2014 whose mission is to maximize the total amount of happiness through health management (健康経営).
  CAPS operates a chain of primary-care clinics plus its Doctor365 telemedicine and urgent-care service,
  provides corporate health-support and wellness programs for employers, runs 24-hour IT-enabled fitness
  gyms, and delivers health-education programs including a Sesame Street partnership. Headquartered in
  Roppongi, Minato-ku, Tokyo, the company was seed-funded by 500 Startups Japan (500 Global) in 2018.
  This API Evangelist profile tracks CAPS as a company; enrichment found no public API, developer portal,
  or machine-readable specification.'
